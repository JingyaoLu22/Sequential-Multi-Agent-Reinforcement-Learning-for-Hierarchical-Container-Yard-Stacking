[project]
name = "stowage-env"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
# Training runtime only; uv.lock pins every version.
dependencies = [
    "gymnasium==1.0.0",
    "matplotlib>=3.8,<4",
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "pettingzoo>=1.25.0",
    "pygame>=2.6.1",
    "sb3-contrib>=2.7.1",
    "scipy>=1.17.0",
    "stable-baselines3==2.7.0",
    "tensorboard>=2.20.0",
    "torch==2.14.0",
    "wandb>=0.24.0",
]

[dependency-groups]
# Notebooks and tests; `uv sync` installs them, `uv sync --no-dev` (Docker) does not.
dev = [
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# `pip install -e .` makes the `stack` package importable from anywhere,
# including the script-style baseline tools under stack/ (e.g. plots.py).
[tool.setuptools.packages.find]
include = ["stack*"]

# CUDA 12.6 build of torch on Linux x86-64 (Docker, clusters); PyPI elsewhere.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
